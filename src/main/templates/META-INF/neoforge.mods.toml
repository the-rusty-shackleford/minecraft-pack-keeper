modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Rusty Shackleford"
# A client-only mod: a server without it is no mismatch.
displayTest="IGNORE_ALL_VERSION"
description='''
Keeps a modpack's resource packs switched on, in the pack's order, from a
list in the pack's config -- so the pack never has to ship anyone's
options.txt, and nobody's settings are overwritten on an update.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"
